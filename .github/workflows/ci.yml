name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ECommerce.slnx

      - name: Build
        run: dotnet build ECommerce.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ECommerce.slnx --configuration Release --no-build --verbosity normal